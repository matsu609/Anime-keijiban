<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13131b">
  <meta name="description" content="アニメの放送予定と、話数ごとの匿名実況・感想スレッド。">
  <title>アニメ掲示板</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="/"><span aria-hidden="true" class="mark">▶</span>アニメ掲示板</a>
    <nav aria-label="サイト内"><a href="/#calendar">番組表</a><a href="/#popular">人気スレッド</a><a href="/#season">今期アニメ</a></nav>
  </div></header>
  <main class="wrap">
    <div id="home">
      <header class="page-heading">
        <h1>アニメ番組表</h1>
        <p>関東の地上波アニメの放送予定と、話数ごとの実況・感想。</p>
      </header>
      <section class="calendar" id="calendar" aria-labelledby="calendar-heading">
        <div class="section-heading"><h2 id="calendar-heading">放送カレンダー</h2><small id="schedule-updated"></small></div>
        <div class="calendar-controls">
          <div class="days" id="days" role="group" aria-label="放送日"></div>
          <select id="other-day" aria-label="ほかの日付">
            <option value="">ほかの日付</option>
          </select>
        </div>
        <div class="day-heading"><h3 id="selected-day"></h3><label>放送局 <select id="channel"><option value="">すべて</option></select></label></div>
        <div id="schedule" aria-live="polite"><p class="empty">番組表を読み込み中…</p></div>
      </section>
      <section class="side" id="popular" aria-labelledby="popular-heading">
        <div class="section-heading"><h2 id="popular-heading">人気スレッド</h2><small>直近7日間</small></div>
        <div id="ranking"><p class="empty">読み込み中…</p></div>
      </section>
      <section class="season-section" id="season" aria-labelledby="season-heading">
        <div class="section-heading"><h2 id="season-heading">今期の地上波アニメ</h2><small id="season-period"></small></div>
        <div id="season-list"><p class="empty">今期の作品を読み込み中…</p></div>
      </section>
    </div>
    <article id="thread" class="thread" hidden>
      <a href="/" class="back">← 番組表</a>
      <header class="thread-heading"><p class="kicker" id="episode"></p><h1 id="thread-title">スレッドを読み込み中…</h1><p id="subtitle"></p></header>
      <div class="thread-votes" id="thread-votes" role="group" aria-label="この話への投票" hidden>
        <button type="button" id="vote-good" aria-pressed="false" disabled>＋ グッド</button>
        <button type="button" id="vote-bad" aria-pressed="false" disabled>− バッド</button>
        <span id="vote-status" role="status"></span>
      </div>
      <section id="discussion" hidden aria-label="コメント">
        <div class="section-heading"><h2>実況・感想</h2><button class="plain" id="older" hidden>過去のコメントを表示</button></div>
        <ol id="comments"></ol>
        <p class="empty" id="no-comments" hidden>まだコメントはありません。</p>
        <form id="comment-form">
          <label for="body">匿名でコメント</label>
          <textarea id="body" name="body" placeholder="実況や感想を書く" required rows="3"></textarea>
          <div class="form-row"><span id="post-status" role="status"></span><button class="primary" type="submit">投稿する</button></div>
        </form>
      </section>
    </article>
  </main>
  <footer class="wrap">番組データ <a href="https://cal.syoboi.jp/">しょぼいカレンダー</a><span>時刻は日本時間</span></footer>
</body>
</html>
